description: 'Vinyl Equity is a modern transfer agency providing equity, cap-table, and
  shareholder-management software for private and public companies. Its platform covers
  registrar services, proxy and AGM (annual general meeting) management, and shareholder
  security, replacing legacy transfer-agent workflows with a modern web application.
  Surfaced as a portfolio company of Index Ventures and profiled in the API Evangelist
  network. No public developer API surface is documented at this time; the profile
  currently captures the company''s security and compliance posture.'
